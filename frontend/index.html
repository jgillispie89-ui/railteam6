<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1f2a24">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Lost Places Map</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <!-- Sign-in screen (the whole map is private) -->
    <div id="login" class="login hidden">
        <form id="login-form" class="login-card" autocomplete="on">
            <div class="login-logo">⛏️</div>
            <h1>Lost Places</h1>
            <p class="muted">Private map. Sign in to continue.</p>
            <label>Email<input id="login-email" type="email" name="email" autocomplete="username" required></label>
            <label>Password<input id="login-password" type="password" name="password" autocomplete="current-password" required></label>
            <button type="submit" class="btn btn-primary btn-big" id="login-btn">Sign in</button>
            <p id="login-error" class="error"></p>
            <p class="muted small">You stay signed in on this device for a year.</p>
        </form>
    </div>

    <div id="app" class="hidden">
        <header class="topbar">
            <div class="brand">⛏️ <span>Lost Places</span></div>
            <div class="search-wrap">
                <input id="search" type="search" placeholder="Search pins or a town…" autocomplete="off">
                <div id="search-results" class="search-results hidden"></div>
            </div>
            <button id="btn-menu" class="icon-btn" title="Menu" aria-label="Menu">☰</button>
            <div id="menu" class="menu hidden">
                <div id="menu-user" class="muted small"></div>
                <button id="btn-signout" class="btn">Sign out</button>
            </div>
        </header>

        <div id="map"></div>

        <!-- Floating controls -->
        <div class="fab-col">
            <button id="btn-layers" class="fab" title="Map style">🗺️</button>
            <button id="btn-filter" class="fab" title="Filter pins">⚙️</button>
            <button id="btn-locate" class="fab" title="My location">📍</button>
        </div>
        <button id="btn-add" class="add-btn">＋ Add pin</button>

        <div id="layers-panel" class="pop hidden">
            <h3>Map style</h3>
            <label class="radio"><input type="radio" name="basemap" value="streets"> Streets</label>
            <label class="radio"><input type="radio" name="basemap" value="satellite"> Satellite (USGS)</label>
            <label class="radio"><input type="radio" name="basemap" value="topo"> Topo (USGS)</label>
            <h3 class="ov-title">Layers on top</h3>
            <div id="overlay-list"></div>
            <h3 class="ov-title">Pins</h3>
            <label class="check"><input type="checkbox" id="toggle-lines"> Old railroad lines</label>
            <label class="check"><input type="checkbox" id="toggle-labels" checked> Pin names</label>
        </div>

        <div id="filter-panel" class="pop hidden">
            <div class="pop-head"><h3>Show pins</h3>
                <span><button class="link" id="filter-all">All</button> · <button class="link" id="filter-none">None</button></span></div>
            <div id="filter-list"></div>
        </div>

        <!-- Placing a pin -->
        <div id="pick-banner" class="pick-banner hidden">
            <div id="pick-text">Tap the map where it is</div>
            <div class="pick-actions">
                <button id="pick-gps" class="btn">📍 Use my location</button>
                <button id="pick-cancel" class="btn">Cancel</button>
            </div>
        </div>

        <!-- Pin page / form sheet -->
        <section id="sheet" class="sheet hidden" aria-live="polite">
            <button id="sheet-close" class="sheet-close" aria-label="Close">✕</button>
            <div id="sheet-body"></div>
        </section>

        <div id="lightbox" class="lightbox hidden">
            <button id="lb-close" class="lb-close" aria-label="Close">✕</button>
            <img id="lb-img" alt="">
            <div id="lb-cap" class="lb-cap"></div>
        </div>

        <div id="toast" class="toast hidden"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
